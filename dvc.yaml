stages:
  preprocess:
    cmd: python src/preprocessing/preprocess.py
    deps:
    - data/raw
    - src/preprocessing/preprocess.py
    outs:
    - data/processed

  train_patchcore:
    cmd: python -m src.training.train_patchcore
    deps:
    - data/raw
    - src/training/datamodule.py
    - src/training/train_patchcore.py
    outs:
    - results/patchcore_summary.json
    - results/patchcore/screw
    - results/patchcore/cable
    - results/patchcore/bottle
  train_stfpm:
    cmd: python -m src.training.train_stfpm
    deps:
    - data/raw
    - src/training/datamodule.py
    - src/training/train_stfpm.py
    outs:
    - results/stfpm_summary.json
    - results/stfpm/bottle
    - results/stfpm/screw
    - results/stfpm/cable
  build_reference:
    cmd: python -m src.monitoring.build_reference
    deps:
    - data/raw
    - results/patchcore/bottle
    - results/patchcore/cable
    - results/patchcore/screw
    - src/inference/predict.py
    - src/monitoring/build_reference.py
    - src/monitoring/image_stats.py
    outs:
    - results/monitoring/reference_bottle.csv
    - results/monitoring/reference_cable.csv
    - results/monitoring/reference_screw.csv
